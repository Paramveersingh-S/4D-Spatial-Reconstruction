version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - USE_LOCAL_STORAGE=true
      - MODEL_DEVICE=cpu
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      # Mount code for live reload during development
      - ./app:/app/app
      # Persist storage and model cache between restarts
      - backend-storage:/app/storage
      - backend-temp:/app/temp
      - model-cache:/app/.model_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  backend-storage:
  backend-temp:
  model-cache:
